[project]
name = "hyperscribe-plugin"
version = "0.0.6"
description = "add commands based on vocal instructions"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    # 0.155.0 ships ENTER_IN_ERROR_CUSTOM_COMMAND_COMMAND in the proto enum,
    # required by the KOALA-5485 amend path for CustomCommand-routed sections
    # (_ros, _history_review, _chart_review, physical_exam, lab_results).
    # 0.164.0 adds the ConfigureCommandButtons effect, used to hide chart-section
    # command buttons while the Scribe tab is active (KOALA-5808).
    # 1.3.1 lets LlmSettingsAnthropic omit temperature and use structured outputs, which
    # Claude Sonnet 5.5 requires for the recommendations.
    "canvas>=1.3.1",
    "canvas[test-utils]>=1.3.1",
    "mypy>=1.15.0",
    "ffmpeg-python>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["commander"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.17.4",
    "types-requests>=2.32.0.20250602",
]

[tool.uv]
# Resolve only releases at least a week old.
exclude-newer = "7 days"
# The canvas SDK releases that let the recommendations run on Claude Sonnet 5.5 (1.3.1 and
# later) are all under a week old as of this pin, so canvas is exempt from the window.
exclude-newer-package = { canvas = "2100-01-01T00:00:00Z" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# ruff's default rule set, plus these codes (unused imports, trailing newlines, trailing
# whitespace, quotes, indentation, line length), which the defaults do not include.
extend-select = ["F401", "W292", "W291", "Q000", "E111", "E117", "E501"]
ignore = [
    # Broad `except Exception` keeps one command, LLM call, or case from failing a whole run.
    "BLE001",
    # The repo root is a package, so ruff reads the checkout directory (canvas-hyperscribe)
    # as a module name.
    "N999",
    # Class-level lists on handlers, models, and commands are declarations, not shared state.
    "RUF012",
    # Prompts are lists of string fragments: "\n".join([...]) and implicit concatenation keep
    # them readable line by line, and parenthesizing every fragment pushes them past 120 columns.
    "FLY002",
    "ISC004",
    # any([...]) checks every field on purpose: the is_available tests pin each can_edit_field call.
    "C419",
    # Nested `if`s carry walrus bindings and clinical comments between the two conditions;
    # nested `with` blocks (patches, connections, cursors) read better than one merged statement.
    "SIM102",
    "SIM117",
    # Changing which exception type is raised, or minting new ones, is a behavior decision.
    "TRY002",
    "TRY004",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# The plugin runs under the Canvas sandbox: it allows typing.Callable/Iterable/Sequence but not
# collections.abc or contextlib, rejects some rewritten import forms, and wraps list/dict so that
# list[str] or X | None annotations fail at load. `canvas validate` catches these; ruff does not.
"hyperscribe/**" = ["UP006", "UP007", "UP035", "UP045", "PLR0402", "S110"]
# Exploratory notebooks keep scratch variables between cells.
"*.ipynb" = ["F841", "RUF007"]

[tool.ruff.format]
# Only apply specific formatting rules
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
