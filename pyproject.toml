[project]
name = "hyperscribe-plugin"
version = "0.0.6"
description = "add commands based on vocal instructions"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    # 0.155.0 ships ENTER_IN_ERROR_CUSTOM_COMMAND_COMMAND in the proto enum,
    # required by the KOALA-5485 amend path for CustomCommand-routed sections
    # (_ros, _history_review, _chart_review, physical_exam, lab_results).
    # 0.164.0 adds the ConfigureCommandButtons effect, used to hide chart-section
    # command buttons while the Scribe tab is active (KOALA-5808).
    # 1.3.1 lets LlmSettingsAnthropic omit temperature and use structured outputs, which
    # Claude Sonnet 5.5 requires for the recommendations.
    "canvas>=1.3.1",
    "canvas[test-utils]>=1.3.1",
    "mypy>=1.15.0",
    "ffmpeg-python>=0.2.0",
    "langdetect>=1.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["commander"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.12.4",
    "types-requests>=2.32.0.20250602",
]

[tool.uv]
# Resolve only releases at least a week old.
exclude-newer = "7 days"
# The canvas SDK releases that let the recommendations run on Claude Sonnet 5.5 (1.3.1 and
# later) are all under a week old as of this pin, so canvas is exempt from the window.
exclude-newer-package = { canvas = "2100-01-01T00:00:00Z" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F401", "W292", "W291", "Q000", "E111", "E117", "E501"]  # Unused imports, trailing newlines, trailing whitespace, quotes, indentation, line length
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
# Only apply specific formatting rules
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
